<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" width="1500" height="500" role="img" aria-label="Zenitech — Software at its peak">
  <defs>
    <radialGradient id="glow1" cx="20%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="85%" cy="100%" r="50%">
      <stop offset="0%" stop-color="#B026FF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#B026FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="dotGlow" x="-300%" y="-300%" width="700%" height="700%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="lineGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1500" height="500" fill="#0A0E1A"/>
  <rect width="1500" height="500" fill="url(#glow1)"/>
  <rect width="1500" height="500" fill="url(#glow2)"/>

  <!-- Corner brackets -->
  <g stroke="#00E5FF" stroke-width="1.5" fill="none" opacity="0.85">
    <path d="M 60 60 L 60 92 M 60 60 L 92 60"/>
    <path d="M 1440 60 L 1440 92 M 1440 60 L 1408 60"/>
    <path d="M 60 440 L 60 408 M 60 440 L 92 440"/>
    <path d="M 1440 440 L 1440 408 M 1440 440 L 1408 440"/>
  </g>

  <!-- Eyebrow with lines -->
  <g transform="translate(750, 150)">
    <line x1="-260" y1="0" x2="-195" y2="0" stroke="#00E5FF" stroke-width="1" filter="url(#lineGlow)"/>
    <line x1="-260" y1="0" x2="-195" y2="0" stroke="#00E5FF" stroke-width="1"/>
    <text x="0" y="5" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-size="14" fill="#00E5FF" text-anchor="middle" letter-spacing="5" font-weight="500">COSTA RICAN SOFTWARE STUDIO</text>
    <line x1="195" y1="0" x2="260" y2="0" stroke="#00E5FF" stroke-width="1" filter="url(#lineGlow)"/>
    <line x1="195" y1="0" x2="260" y2="0" stroke="#00E5FF" stroke-width="1"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(750, 285)">
    <text x="0" y="0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="135" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="-5" filter="url(#textGlow)">zenitech</text>
    <text x="0" y="0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="135" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="-5">zenitech</text>
    <text x="285" y="0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="135" font-weight="700" fill="#00E5FF" text-anchor="start" filter="url(#dotGlow)">.</text>
    <text x="285" y="0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="135" font-weight="700" fill="#00E5FF" text-anchor="start">.</text>
  </g>

  <!-- Tagline -->
  <text x="750" y="365" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="300" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">Software at its peak.</text>

  <!-- Bottom URL -->
  <text x="1400" y="430" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-size="12" fill="#00E5FF" text-anchor="end" letter-spacing="3" filter="url(#textGlow)">crzenitech.com</text>
  <text x="1400" y="430" font-family="'Consolas', 'Monaco', 'Courier New', monospace" font-size="12" fill="#00E5FF" text-anchor="end" letter-spacing="3">crzenitech.com</text>
</svg>
